<script>
// ?did=did:nostr:<hex> (or ?pk=<hex>): one key as the record sees it: who controls it, what it controls, its GitHub identity, and every row it signed
(() => {
  const q = new URLSearchParams(location.search); const raw = (q.get('did') || q.get('pk') || '').trim(); const hex = (raw.match(/^(?:did:nostr:)?([0-9a-f]{64})$/i) || [])[1];
  const island = { '@context': 'https://bitcoin-desktop.github.io/schema/context.jsonld', '@id': '#this', '@type': 'Key' };
  if (hex) Object.assign(island, { name: `key ${hex.slice(0, 8)}…${hex.slice(-4)}`, sameAs: { '@id': 'did:nostr:' + hex.toLowerCase() }, description: 'One key: its identity, who it says controls it and whether the controller agrees, the keys it controls, its GitHub identity if claimed, and every attestation it signed, on the record and on the relays. Everything shown green was checked in this page.' });
  else Object.assign(island, { name: 'key', description: 'Open this page as key.html?did=did:nostr:<hex> to see a key as the record sees it.' });
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(island, null, 2); document.head.append(s); document.title = island.name;
})();
</script>
