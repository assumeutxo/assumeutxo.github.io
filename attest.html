  "description": "An attestation is one person saying, with their name or key on it, that they computed a snapshot's hash themselves and what they got.",
  "sections": [
    {
      "name": "The bar",
      "text": "You ran it on a node you control, and the hash came out of your own validation, one of two ways. Recomputed: your node validated the chain to that height and you ran dumptxoutset or gettxoutsetinfo there. Loaded: you loaded the snapshot and let background validation finish, so your node rebuilt the set from genesis and confirmed the match. Checking a file's sha256 proves you have the right bytes, not that the bytes are right, and is recorded as possession, not verification."
    },
    {
      "name": "Informal, today",
      "text": "Paste your node's output as a comment on the pinned issue: the chain, the height, the implementation and version, the date, and the txoutset_hash line. It is recorded on the snapshot's page as your handle, the date, what you did, your hash beside the entry's, and a link to your comment. The site vouches for nothing beyond \"the hash you wrote matches\" or \"does not\". A disagreement is recorded and shown, never rejected. The reviews already on the Core and Knots pull requests were recorded this way.",
      "link": {
        "@id": "https://github.com/assumeutxo/assumeutxo.github.io/issues/5",
        "name": "Attest a snapshot here"
      }
    },
    {
      "name": "Formal, now",
      "text": "The same facts as a canonical statement (NIP-332), signed by your Nostr key, checked in the page: signature, canonical form, the rules of the claim, and that it states the hash the page states. Three outputs from your node, dumptxoutset with a rollback to the height, getchainstates, and getnetworkinfo, go into the sign page and your extension signs; or the tool reads them over RPC and types nothing. Then publish the event to a relay, or open a pull request adding it as attestations/<network>-<height>/<pubkey>.json. Your own key is the best key; a key mined with leading zeros is a start. Your informal comment stays and links to it. GPG is next.",

        },

          "name": "the tool: sign from a node over RPC, verify, publish"
        },

        }

    {
      "name": "What the page shows",
      "text": "Green for what it checked itself. Grey for what is only linked or claimed. Nothing else."
    },
    {
      "name": "Keys, not names",
      "text": "A name is a column. Weight comes from a key's history: statements that held up when checked. One key, one standing statement per snapshot. Counts never decide a hash; a recompute does. A new key has no history yet; a key with leading zero bits, mined before its first statement, starts with something to show, and the page shows the bits as a column, never as a verdict."
